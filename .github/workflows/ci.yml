name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  # Standalone (no-`registry`) verification — the image-crate contract's
  # `ci-standalone` job. Image-library consumers depend on the crate
  # with `default-features = false` to skip the `oxideav-core` dep tree
  # entirely; this job builds, lints and tests that configuration on
  # every change. Inline rather than forwarded through the reusable
  # workflow because that workflow's `extra_test_args` doesn't reach
  # the build step.
  ci-standalone:
    name: Build no-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: standalone
      - name: cargo build --lib --no-default-features
        run: cargo build --lib --no-default-features --verbose
      - name: cargo clippy --all-targets --no-default-features
        run: cargo clippy --all-targets --no-deps --no-default-features -- -D warnings
      - name: cargo test --no-default-features
        run: cargo test --no-default-features --verbose
